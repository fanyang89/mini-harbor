x-app-build: &app-build
  context: .
  args:
    GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}

services:
  rqlite:
    image: rqlite/rqlite:10.6.0@sha256:a63af1b16b051ed7d8c81b57b4d704d47faaf1c0002f60c8b6bb06a41535644a
    restart: unless-stopped
    volumes:
      - rqlite-data:/rqlite/file
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:3
    restart: unless-stopped
    environment:
      OTEL_TRACES_EXPORTER: none
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-mini-harbor-local-development-secret}
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/config.yml:/etc/distribution/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  registry-gateway:
    image: ${MINI_HARBOR_IMAGE:-ghcr.io/fanyang89/mini-harbor:latest}
    build: *app-build
    restart: unless-stopped
    entrypoint: ["mini-harbor-gateway"]
    environment:
      LISTEN_ADDR: :5000
      LOCAL_REGISTRY_URL: http://registry:5000
      PROXY_CONFIG_PATH: /etc/mini-harbor/proxies.yml
      PROXY_STORAGE_ROOT: /var/lib/registry-proxy
      RQLITE_URLS: ${RQLITE_URLS:-http://rqlite:4001}
      DOCKER_HUB_REMOTE_URL: ${DOCKER_HUB_REMOTE_URL:-https://registry-1.docker.io}
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-mini-harbor-local-development-secret}
      HTTP_PROXY: ${PROXY_HTTP_PROXY:-}
      HTTPS_PROXY: ${PROXY_HTTPS_PROXY:-}
      NO_PROXY: ${PROXY_NO_PROXY:-localhost,127.0.0.1,registry,rqlite}
      OTEL_TRACES_EXPORTER: none
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry-proxy-data:/var/lib/registry-proxy
      - ./registry/proxies.yml:/etc/mini-harbor/proxies.yml:ro
    depends_on:
      rqlite:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: ${MINI_HARBOR_IMAGE:-ghcr.io/fanyang89/mini-harbor:latest}
    build: *app-build
    restart: unless-stopped
    environment:
      LISTEN_ADDR: :8080
      REGISTRY_URL: http://registry:5000
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-localhost:5000}
      RQLITE_URLS: ${RQLITE_URLS:-http://rqlite:4001}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_SESSION_SECRET: ${OIDC_SESSION_SECRET:-}
      OIDC_COOKIE_SECURE: ${OIDC_COOKIE_SECURE:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      rqlite:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/auth/me"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  rqlite-data:
  registry-data:
  registry-proxy-data:
  mini-harbor-data:
