services:
  registry:
    environment:
      REGISTRY_HTTP_RELATIVEURLS: "true"
  registry-gateway:
    ports: !override
      - "${LAN_IP:?Set LAN_IP to the server LAN address}:${REGISTRY_PORT:-5000}:5000"
  web:
    ports: !override
      - "${LAN_IP:?Set LAN_IP to the server LAN address}:${WEB_PORT:-8080}:8080"
    environment:
      REGISTRY_PUBLIC_URL: ${LAN_IP:?Set LAN_IP}:${REGISTRY_PORT:-5000}
